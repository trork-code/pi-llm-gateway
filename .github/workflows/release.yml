name: release

# goreleaser配布(design-batch3.md §5)。タグpush(v*)でのみ走る。
# CI(ci.yml)とは完全に独立(build/test/scanはリリース前のCIで済んでいる前提)。
# 初回リリースは手動タグ(v0.3.0)をpushするだけ:
#   git tag v0.3.0 && git push origin v0.3.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # Release作成とasset添付

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # changelog(git log)の生成のため全履歴とタグを取得
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # .goreleaser.ymlのversion:2スキーマでチェック済みの固定版(bumpは.goreleaser.ymlの動作確認後)
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
